<script>
// YouTube tab + Settings card. Merge into app.html's <script>. api(path, body?) is the app's helper (GET without body, POST with).
// Needs routes from ytstats.handle plus POST /api/yt/ideas {run,file} -> {titles:[5],hooks:[3],recut:""} (app.py runs ytstats.ai_prompt with the chosen AI) or {error}.
const ytEl = (t, css, txt, kids) => { const e = document.createElement(t); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; (kids || []).forEach(k => e.append(k)); return e; };
const ytBtn = (txt, fn, css) => { const b = ytEl('button', css || '', txt); b.onclick = fn; return b; };
const ytNum = n => n == null ? '-' : Math.round(n).toLocaleString();

async function renderYtPanel(container, short, api) {
  container.replaceChildren();
  const st = await api('/api/yt/status'), q = `?run=${encodeURIComponent(short.run)}&file=${encodeURIComponent(short.file)}`;
  const note = (t, c) => container.append(ytEl('div', `padding:10px 12px;border:2px solid var(--l);border-radius:var(--r);margin:8px 0;color:${c || 'var(--m)'}`, t));
  if (!st.has_key) {note('See views, likes and why this Short is not doing better. You need a free YouTube Data API key (Google Cloud Console > APIs > YouTube Data API v3 > Credentials). It stays on this PC.'); return container.append(ytBtn('Add my key', () => { E('st').click(); setTimeout(() => E('ytset').scrollIntoView(), 150); }));}
  const link = ytEl('input', 'flex:1;min-width:200px;min-height:44px;padding:8px 12px;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:var(--r)');
  link.placeholder = 'Paste the YouTube link of this Short'; link.setAttribute('aria-label', 'YouTube link');
  const body = ytEl('div'), go = async () => {
    body.replaceChildren(ytEl('div', 'color:var(--m)', 'Loading...'));
    const d = await api('/api/yt/diagnose' + q); body.replaceChildren();
    if (d.error) return body.append(ytEl('div', 'color:var(--f)', d.error));
    if (!d.linked) return body.append(ytEl('div', 'color:var(--m)', d.hint + (st.channel ? ' Or post it with the same title and it links itself.' : ' Add your channel in Settings to auto-link by title.')));
    const v = d.video, m = d.median || {}, a = d.analytics || {}, tiles = ytEl('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0');
    const tile = (label, val, med, bad) => tiles.append(ytEl('div', `background:var(--c);border:2px solid ${bad ? 'var(--f)' : 'var(--l)'};border-radius:var(--r);padding:10px;box-shadow:var(--sh)`, null,
      [ytEl('div', 'font:12px system-ui;color:var(--m)', label), ytEl('div', 'font:700 22px var(--fd)', val), ytEl('div', 'font:12px system-ui;color:var(--m)', med == null ? '' : 'your median ' + med)]));
    tile('Views', ytNum(v.views), ytNum(m.views), m.views && v.views < .5 * m.views);
    tile('Likes', ytNum(v.likes), ytNum(m.likes)); tile('Comments', ytNum(v.comments));
    if (a.averageViewPercentage != null) tile('Avg viewed', Math.round(a.averageViewPercentage) + '%', m.averageViewPercentage != null ? Math.round(m.averageViewPercentage) + '%' : null, m.averageViewPercentage && a.averageViewPercentage < .8 * m.averageViewPercentage);
    if (a.kept_at_3s != null) tile('Still there at 3 s', Math.round(a.kept_at_3s * 100) + '%', null, a.kept_at_3s < .7);
    if (a.subscribersGained != null) tile('Subs gained', ytNum(a.subscribersGained), m.subscribersGained != null ? ytNum(m.subscribersGained) : null);
    body.append(ytEl('div', 'font-weight:600', v.title), tiles);
    if (d.level === 'key') body.append(ytEl('div', 'color:var(--m);font-size:13px', st.has_oauth ? 'Sign in with Google (Settings > YouTube) to also see watch time and drop-off.' : 'Add your OAuth client in Settings > YouTube to also see watch time and drop-off in the first 3 seconds.'));
    const col = { bad: 'var(--f)', warn: 'var(--w)', info: 'var(--at)' };
    body.append(ytEl('h3', 'margin:14px 0 6px', d.reasons.length ? 'Why it may not be doing well' : 'No problems found by the rules'),
      ...d.reasons.map(r => ytEl('div', `border-left:5px solid ${col[r.level] || 'var(--l)'};padding:6px 10px;margin:6px 0;background:var(--p)`, r.text)));
    const out = ytEl('div'), ideas = ytBtn('Title and hook ideas', async () => {
      out.replaceChildren(ytEl('div', 'color:var(--m)', 'Asking your AI tool...'));
      const r = await api('/api/yt/ideas', { run: short.run, file: short.file }); out.replaceChildren();
      if (r.error) return out.append(ytEl('div', 'color:var(--f)', r.error));
      const sect = (h, arr) => out.append(ytEl('h3', 'margin:12px 0 4px', h), ...arr.map(t => ytEl('div', 'display:flex;gap:8px;align-items:center;margin:4px 0', null, [ytEl('span', 'flex:1', t), ytBtn('Copy', e => { navigator.clipboard.writeText(t); e.target.textContent = 'Copied'; })])));
      sect('Titles', r.titles || []); sect('Hooks', r.hooks || []); if (r.recut) sect('Re-cut idea', [r.recut]);
    }, 'margin-top:12px;border-color:var(--a)');
    body.append(ideas, out);
  };
  container.append(ytEl('div', 'display:flex;gap:8px;flex-wrap:wrap', null, [link, ytBtn('Link', async () => { const r = await api('/api/yt/link', { run: short.run, file: short.file, url: link.value }); r.error ? note(r.error, 'var(--f)') : go(); })]), body);
  go();
}

async function renderYtSettings(container, api) {
  const draw = async () => {
    const st = await api('/api/yt/status'); container.replaceChildren();
    const inp = (ph, type) => { const i = ytEl('input', 'min-height:44px;padding:8px 12px;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:var(--r);width:100%;box-sizing:border-box;margin:4px 0'); i.placeholder = ph; i.type = type || 'text'; i.setAttribute('aria-label', ph); i.autocomplete = 'off'; return i; };
    const key = inp('YouTube Data API key (never shown again)', 'password'), ch = inp('Your channel (@handle or UC id)'); ch.value = st.channel || '';
    const msg = ytEl('div', 'color:var(--m);margin-top:6px'), file = ytEl('input'); file.type = 'file'; file.accept = '.json'; file.setAttribute('aria-label', 'OAuth client JSON');
    container.append(ytEl('h3', 'margin:0 0 6px', 'YouTube stats'),
      ytEl('div', 'color:var(--m);font-size:13px', 'Use your own keys. They stay on this PC and are write-only here. Level 1: API key = views, likes, why-not-better rules. Level 2: OAuth client = watch time and drop-off.'),
      ytEl('div', 'margin:6px 0', st.has_key ? 'API key saved.' : 'No API key yet.'), key, ch,
      ytBtn('Save', async () => { const r = await api('/api/yt/key', { api_key: key.value, channel: ch.value }); r.error ? (msg.style.color = 'var(--f)', msg.textContent = r.error) : draw(); }),
      ytEl('div', 'margin:14px 0 4px', st.signed_in ? 'Signed in to Analytics.' : 'Optional: OAuth client JSON (Google Cloud, Desktop app).'), file,
      ytBtn('Add and sign in', async () => { if (!file.files[0]) return; const r = await api('/api/yt/oauth', { client_json: await file.files[0].text() }); if (r.error) { msg.style.color = 'var(--f)'; msg.textContent = r.error; } else { window.open(r.auth_url, '_blank', 'noopener'); msg.textContent = 'Finish the sign-in in the new tab, then reopen this card.'; } }, 'margin-left:8px'), msg);
  };
  draw();
}

async function loadMisc(){const [c,p]=await Promise.all([api('/api/connections'),api('/api/published')]);const b=c&&c.blotato;if(b){BLO.has=!!b.has_key;if(/^https:\/\//.test(b.signup_url||''))BLO.url=b.signup_url}PUB=p&&!p.error?p:null;const r=E('blr');if(r){if(BLO.has){r.href='#apr';r.removeAttribute('target')}else{r.href='#';r.removeAttribute('target');r.setAttribute('data-bloc','')}}}
async function updCheck(force){const r=await api('/api/update/check'+(force?'?force=1':''));UPDI=r;UPDT=Date.now();paintUpd();return r}
function paintUpd(){const b=E('nu');if(!b)return;const on=!!(UPDI&&UPDI.update);b.hidden=!on;if(on)b.title=t('upd.ready',{v:UPDI.latest});if(VIEW=='home'&&!document.querySelector('dialog[open]'))drawHome()}
async function runBusy(){const j=arr(await api('/api/jobs'));return j.some(x=>x.status=='running'&&!x.dry)}
async function updNow(){if(!UPDI||!UPDI.update)return;if(await runBusy())return toast(t('upd.busy'),true);
 if(!await ask(t('upd.ask',{v:UPDI.latest}),{ok:t('upd.now'),pre:t('upd.safe')}))return;toast(t('upd.running'));const r=await api('/api/update/apply',{});
 if(r&&r.ok&&r.changed!==false){UPDI=null;paintUpd();toast(t('upd.done',{v:r.version||r.current||''}));setTimeout(()=>location.reload(),2500)}else toast(t('upd.failed'),true)}
const updBanner=()=>UPDI&&UPDI.update?`<div class="panel hi" id=ub><div class=bar><b>${te('upd.ready',{v:UPDI.latest})}</b><button class=p id=ub_go>${te('upd.now')}</button><a class=btn href="https://guide.nocodehack.io/gta6-clipper/" target=_blank rel="noopener noreferrer">${te('upd.whats_new')}</a></div><small>${te('upd.safe')}</small></div>`:'';

function propose(){const d=E('prop');E('pr_t').textContent=t('prop.title');E('pr_s').textContent=t('prop.sub');E('pr_x').placeholder=t('prop.ph');E('pr_x').value='';E('pr_m').textContent='';E('pr_l').hidden=true;E('pr_cp').hidden=true;E('pr_go').textContent=t('prop.send');E('pr_no').textContent=t('prop.cancel');E('pr_cp').textContent=t('prop.copy');E('pr_go').disabled=false;d.showModal();E('pr_x').focus()}
async function propSend(){const x=E('pr_x').value.trim();if(!x)return E('pr_x').focus();E('pr_go').disabled=true;const r=await api('/api/proposals',{text:x});
 if(r&&r.ok){E('pr_m').textContent=t('prop.sent');if(r.issue_url){E('pr_l').href=r.issue_url;E('pr_l').textContent=t('prop.open');E('pr_l').hidden=false}E('pr_cp').hidden=false}else{E('pr_m').textContent=t('prop.failed');E('pr_cp').hidden=false;E('pr_go').disabled=false}}
// ---------- streamers + live hunt ----------
const sKey=s=>s.platform+':'+String(s.handle).toLowerCase();
function parseStr(x){x=x.trim();let m;if(m=x.match(/twitch\.tv\/([\w.\-]+)/i))return{platform:'twitch',handle:m[1]};if(m=x.match(/kick\.com\/([\w.\-]+)/i))return{platform:'kick',handle:m[1]};if(m=x.match(/youtube\.com\/(@[\w.\-]+)/i))return{platform:'youtube',handle:m[1]};if(/^@[\w.\-]+$/.test(x))return{platform:'youtube',handle:x};if(/^[\w.\-]{1,60}$/.test(x))return{platform:'twitch',handle:x};return null}
const strAdd=(lang,s)=>api('/api/streamers',{lang,platform:s.platform,handle:s.handle,name:s.name||s.handle,add:true});
const strRm=(lang,s)=>api('/api/streamers',{lang,platform:s.platform,handle:s.handle,remove:true});
const rmGet=()=>{try{return JSON.parse(lsGet('clipper_rm_'+LANG)||'[]')}catch(e){return[]}};
const strMade=s=>{const n=String(s.name).toLowerCase(),h=String(s.handle).replace('@','').toLowerCase();return D.shorts.filter(x=>{const c=((x.stream.channel||'')+' '+(x.stream.title||'')).toLowerCase();return c.includes(n)||c.includes(h)}).length};
const CLIPC={allowed:['PASS','clip.allowed'],ask:['len','clip.ask'],no:['FAIL','clip.no'],unknown:['na','clip.unknown']};
const clipChip=c=>{c=c||{rule:'unknown'};const [k,l]=CLIPC[c.rule]||CLIPC.unknown,tip=esc(c.note||(c.rule=='unknown'?t('clip.unknown_tip'):''));return c.source?`<a class="chip ${k}" href="${esc(c.source)}" target=_blank rel=noopener title="${tip}">${te(l)}</a>`:`<span class="chip ${k}" title="${tip}">${te(l)}</span>`};
const clipOk=async c=>!(c&&c.rule=='no')||await ask(t('clip.no_ask')+(c.note?'\n'+c.note:''),{ok:t('clip.have_perm')});
const hSt=r=>r.watching&&r.live?['PASS','hunt.st.watching']:r.watching?['na','hunt.st.waiting']:r.live?['WARN','str.live_now']:['na','str.offline'];
const hRow=r=>{const [c,k]=hSt(r);return `<div class=hrow><b>${esc(r.name)}</b>${clipChip(r.clip)}<span class=m style="flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title||'')}</span><span class="chip ${c}">${te(k)}</span><small>${r.chat_per_min==null?'':te('hunt.chat',{n:Math.round(r.chat_per_min)})}</small><small>${te((r.clips_found||0)==1?'hunt.clip':'hunt.clips',{n:r.clips_found||0})}</small><button class=sm data-hsee="${esc(r.name)}">${te('hunt.see_clips')}</button></div>`};
function paintHunt(el,max){if(!el||!el.isConnected)return;if(!Array.isArray(HUNT)){el.innerHTML=`<div class=err>${esc((HUNT&&HUNT.error)||'')}</div>`;return}
 const rows=HUNT.filter(r=>r.live||r.watching);
 if(!HUNTON&&!rows.some(r=>r.watching))el.innerHTML=`<p class=m>${te('empty.hunt_off')}</p><div class=row><button class=p data-hunt=on>${te('hunt.start')}</button></div>`;
 else if(!rows.length)el.innerHTML=`<p class=m>${te('empty.hunt_idle')}</p>`;
 else el.innerHTML=rows.slice(0,max).map(hRow).join('')+(max<rows.length?`<button class=sm data-go=str>${te('hunt.see_all')} (${rows.length})</button>`:'')+`<small class=m>${te('hunt.footer')}</small>`}
async function loadHunt(el,max){el.innerHTML=`<small class=m><span class=spin></span></small>`;HUNT=await api('/api/hunt?lang='+LANG);paintHunt(el,max);return HUNT}
async function huntSet(on){HUNTON=on;lsSet('clipper_hunt',on?'1':'0');const rows=Array.isArray(HUNT)?HUNT:[];
 for(const r of rows){if(on&&r.live&&!r.watching&&!(r.clip&&r.clip.rule=='no'))await api('/api/hunt/start',{platform:r.platform,handle:r.handle});if(!on&&r.watching)await api('/api/hunt/stop',{platform:r.platform,handle:r.handle})}draw()}
